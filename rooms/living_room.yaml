# A room layout is normal YAML. Coordinates are tile-grid positions.
name: living_room
grid_size: [14, 11]
# Tile-grid coordinate. The player spawns at this cell's visual center.
player_start: [7, 10]

layers:
  - name: Floor
    z_index: 0
    operations:
      - type: fill
        tile: floor.checkered
  - name: Frame
    z_index: 1
    operations:
      - type: frame
        top_rows:
          - wall.wood.vertical.top
          - wall.wood.vertical.bottom
        bottom: border.white.bottom
        left: border.white.left
        right: border.white.right
        top_left: border.corner.top_left
        top_right: border.corner.top_right
        bottom_left: border.corner.bottom_left
        bottom_right: border.corner.bottom_right

# Prop IDs are keys, so the layout only needs to state their placement.
props:
  prop.plant.bushy:
    at: [4, 4]
  prop.bed.single:
    at: [0, 0]
  prop.side_table:
    at: [4, 0]
  prop.chair.right:
    at: [6, 0]
